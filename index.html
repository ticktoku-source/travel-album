<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>みんなの旅アルバム</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#26332e;--sub:#68736e;--accent:#4d7668;--line:#ddd}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{padding:24px 18px;background:#eaf3ee}.wrap{max-width:900px;margin:auto}header h1{margin:0 0 5px}
nav{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:10;overflow:auto;border-bottom:1px solid var(--line)}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.on,.primary{background:var(--accent);color:#fff}.danger{background:#c94b4b;color:#fff}
main{max-width:900px;margin:auto;padding:16px}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:90px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.item img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}.meta{padding:11px;font-size:14px}.small{font-size:12px;color:var(--sub)}
.timeline{border-left:3px solid #d6e2dc;padding-left:15px}.stop{margin:0 0 16px}
#picked{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}#picked .pick{position:relative}#picked img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
#picked .removePick{position:absolute;top:5px;right:5px;width:32px;height:32px;padding:0;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:18px}
.caption{margin-top:8px;padding:11px 12px;background:#eef4f0;border-radius:10px;line-height:1.65;font-size:16px;font-weight:600;color:#26332e;white-space:pre-wrap;overflow-wrap:anywhere;border-left:4px solid #4d7668}.caption:before{content:"💬 ";}.placeLine{font-weight:700}
#toast{display:none;position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#26332e;color:white;padding:12px 18px;border-radius:999px;z-index:120;white-space:nowrap}
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;align-items:center;justify-content:center;padding:12px}
#viewer.on{display:flex}#viewer img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:8px}
.vbtn{position:absolute;background:rgba(255,255,255,.9);color:#222;font-size:28px;width:48px;height:48px;padding:0;border-radius:999px}
#close{top:max(15px,env(safe-area-inset-top));right:15px}#prev{left:12px;top:50%;transform:translateY(-50%)}#next{right:12px;top:50%;transform:translateY(-50%)}
#counter{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));color:#fff;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px}
.editbox{margin-top:9px;padding-top:9px;border-top:1px solid #eee}
.progress{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#edf4f0;color:#3f6c5d;font-size:13px}
@media(min-width:700px){.gallery{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="wrap"><h1 id="title">みんなの旅アルバム</h1><div id="tripdate">旅の思い出を、みんなで一冊に。</div></div></header>
<nav><div class="wrap" style="display:flex;gap:8px"><button class="tab on" data-id="album">📷 アルバム</button><button class="tab" data-id="add">＋ 写真追加</button><button class="tab" data-id="guide">🗺️ しおり</button><button class="tab" data-id="story">📖 旅行記</button><button class="tab" data-id="settings">⚙️ 設定</button></div></nav>
<main>
<section id="album" class="panel on"><div id="gallery" class="gallery"></div><div id="empty" class="card">まだ写真がありません。「写真追加」から旅の一枚を入れてみましょう。</div></section>
<section id="add" class="panel"><div class="card"><h2>写真を追加</h2><p>写真を1枚でも複数枚でも選べます。似た写真があれば、保存前に写真右上の「×」で外せます。コメントや場所は追加後に記入できます。</p>
<input id="file" type="file" accept="image/*" multiple><div id="picked"></div>
<button id="save" class="primary">選んだ写真をまとめて追加</button><div id="progress" class="progress"></div>
</div></section>
<section id="guide" class="panel"><div class="card"><h2>旅のしおり</h2><div id="timeline" class="timeline"></div></div></section>
<section id="story" class="panel">
  <div class="card">
    <h2>旅の記録（旅行記）</h2>
    <textarea id="storytext" style="min-height:280px"></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <button id="make" class="primary">旅行記を作成・更新</button>
      <button id="saveTxt" class="primary" style="background:#2f5d80">📄 メモ帳へ保存（テキスト出力）</button>
    </div>
  </div>
  <div class="card" style="border-color:#e0b2b2;background:#fff8f8">
    <h3 style="color:#c94b4b;margin-top:0">旅の締めくくり（アルバムの初期化）</h3>
    <p class="small">保存が完了したら、下のボタンでアルバムを空にして次の旅行の準備ができます。</p>
    <button id="clearAll" class="danger">⚠️ アルバムの写真・記録をすべて消去する</button>
  </div>
</section>
<section id="settings" class="panel"><div class="card"><h2>旅行設定</h2><label>タイトル</label><input id="stitle" value="兄弟で行く 一泊二日の旅"><label>日程</label><input id="sdate" value="2026年 秋"><label>旅程（時刻｜内容｜場所）</label><textarea id="plan" style="min-height:190px">08:00｜集合・出発｜自宅付近
10:30｜立ち寄り｜道の駅
12:00｜昼食｜ご当地グルメ
15:00｜宿に到着｜温泉宿
18:00｜夕食｜宿
09:30｜2日目 出発｜宿
11:00｜観光｜名所
15:00｜帰路へ｜</textarea><button id="saveset" class="primary">設定を保存</button></div></section>
</main>
<div id="viewer"><button id="close" class="vbtn">×</button><button id="prev" class="vbtn">‹</button><img id="viewerimg"><button id="next" class="vbtn">›</button><div id="counter"></div></div><div id="toast"></div>
<script>
const $=x=>document.querySelector(x),$$=x=>document.querySelectorAll(x);let photos=[],current=0,db,selectedFiles=[];
const DB="TabiAlbumDB16",STORE="photos";
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(s){$("#toast").textContent=s;$("#toast").style.display="block";setTimeout(()=>$("#toast").style.display="none",1800)} function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE,{keyPath:"id"})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})} function getAll(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>a.id-b.id));r.onerror=()=>rej(r.error)})} function put(p){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).put(p);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})} function remove(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})} function clearDB(){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})} async function refresh(){   photos=await getAll();   render(); } $$(".tab").forEach(b=>b.onclick=()=>{$$(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.id).classList.add("on")});
$("#file").onchange=e=>{selectedFiles=[...e.target.files];renderPicked()};
function renderPicked(){
 $("#picked").innerHTML="";
 selectedFiles.forEach((f,i)=>{let box=document.createElement("div");box.className="pick";let im=document.createElement("img");im.src=URL.createObjectURL(f);let b=document.createElement("button");b.className="removePick";b.textContent="×";b.title="この写真を選択から外す";b.onclick=()=>{selectedFiles.splice(i,1);renderPicked()};box.appendChild(im);box.appendChild(b);$("#picked").appendChild(box)});
}
// 画像をBase64テキストデータに変換＆軽量圧縮
function compressToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        let w = img.width, h = img.height;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * (max / w)); w = max; }
          else { w = Math.round(w * (max / h)); h = max; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
$("#save").onclick=async()=>{
  let fs=[...selectedFiles];
  if(!fs.length)return alert("写真を選んでください");
  $("#save").disabled=true;
  $("#progress").style.display="block";
  let ok=0;
  try{
    for(let i=0;i<fs.length;i++){
      $("#progress").textContent=`${fs.length}枚中 ${i+1}枚目を保存中…`;
      let b64=await compressToBase64(fs[i]);
      await put({id:Date.now()+i,img:b64,author:"",comment:"",date:"",place:""});
      ok++;
    }
    $("#file").value="";selectedFiles=[];$("#picked").innerHTML="";
    await refresh();
    document.querySelector('[data-id="album"]').click();
    toast(ok+"枚の写真を追加しました");
  }catch(e){
    alert("保存中に問題が発生しました。");
  }finally{
    $("#save").disabled=false;
    $("#progress").style.display="none";
  }
};
function render(){
 $("#empty").style.display=photos.length?"none":"block";
 const gallery=$("#gallery");
 gallery.innerHTML="";
 photos.forEach((p,i)=>{
   const div=document.createElement("div");
   div.className="item";
   div.innerHTML=`
     <img id="img_${i}" src="${p.img||''}">
     <div class="meta">
       <div class="placeLine">${esc(p.place||"旅の一枚")}</div>
       ${p.comment?`<div class="caption">${esc(p.comment)}</div>`:`<div class="small" style="margin-top:6px">コメントはまだありません</div>`}
       <div class="small" style="margin-top:6px">${esc(p.date)}${p.date&&p.author?" ・ ":""}${esc(p.author)}</div>
       <details class="editbox"><summary>✏️ コメント・場所などを追加／編集</summary>
         <input id="place${i}" placeholder="場所 例：宇都宮" value="${esc(p.place)}">
         <input id="date${i}" type="date" value="${esc(p.date)}">
         <input id="author${i}" placeholder="撮影者 例：Toku" value="${esc(p.author)}">
         <textarea id="comment${i}" placeholder="ひとこと 例：餃子の食べ比べ！">${esc(p.comment)}</textarea>
         <button class="primary" onclick="saveInfo(${i})">記入内容を保存</button> <button onclick="del(${i})">削除</button>
       </details>
     </div>`;
   gallery.appendChild(div);
   const imgEl=div.querySelector(`#img_${i}`);
   imgEl.onclick=()=>openViewer(i);
 });
}
window.saveInfo=async i=>{
  let p={...photos[i]};
  p.place=$("#place"+i).value;
  p.date=$("#date"+i).value;
  p.author=$("#author"+i).value;
  p.comment=$("#comment"+i).value;
  await put(p);
  toast("写真の情報を保存しました");
  await refresh();
}
window.del=async i=>{if(confirm("この写真を削除しますか？")){await remove(photos[i].id);await refresh();}}
window.openViewer=i=>{current=i;showViewer();$("#viewer").classList.add("on")}
function showViewer(){if(!photos.length)return;current=(current+photos.length)%photos.length;$("#viewerimg").src=photos[current].img\vert{}\vert{}'';$("#counter").textContent=(current+1)+" / "+photos.length;$("#prev").style.display=$("#next").style.display=photos.length>1?"block":"none"}
$("#prev").onclick=e=>{e.stopPropagation();current--;showViewer()};$("#next").onclick=e=>{e.stopPropagation();current++;showViewer()};$("#close").onclick=()=>$("#viewer").classList.remove("on");$("#viewer").onclick=e=>{if(e.target.id==="viewer")$("#viewer").classList.remove("on")}
let sx=0;$("#viewer").addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});$("#viewer")
.addEventListener("touchend",e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>50){current+=dx<0?1:-1;showViewer()}},{passive:true});
function settings(){let s=JSON.parse(localStorage.getItem("tripSettings15")||"{}");if(s.title)$("#stitle").value=s.title;if(s.date)$("#sdate").value=s.date;if(s.plan)$("#plan").value=s.plan;$("#title").textContent=$("#stitle").value;$("#tripdate").textContent=$("#sdate").value+" ｜ 旅の思い出を、みんなで一冊に。";$("#timeline").innerHTML=$("#plan").value.split("\n").filter(Boolean).map(x=>{let a=x.split("｜");return `<div class="stop"><b>${esc(a[0])} ${esc(a[1])}</b><div class="small">${esc(a[2])}</div></div>`}).join("")}
$("#saveset").onclick=()=>{localStorage.setItem("tripSettings15",JSON.stringify({title:$("#stitle").value,date:$("#sdate").value,plan:$("#plan").value}));settings();toast("旅行設定を保存しました")}
$("#make").onclick=()=>{$("#storytext").value=$("#stitle").value+"\n\n日程："+$("#sdate").value+"\n\n"+[...photos].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(p=>`【${p.date||"日付なし"} ${p.place||"場所なし"}】\n撮影：${p.author||"参加者"}\nコメント：${p.comment||"（なし）"}`).join("\n\n")+"\n\n―― みんなの写真と言葉から作った旅の記録 ――";toast("旅行記を作成しました")}
$("#saveTxt").onclick=()=>{
  if(!$("#storytext").value)$("#make").click();
  let blob=new Blob([$("#storytext").value],{type:"text/plain"});
  let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=$("#stitle").value+"_旅行記.txt";a.click();
}
$("#clearAll").onclick=async()=>{
  if(confirm("【確認】ファイルの保存は完了しましたか？\n\n本当にすべての写真と記録を削除して、アルバムを初期化しても宜しいですか？")){
    await clearDB();
    $("#storytext").value="";
    await refresh();
    document.querySelector('[data-id="album"]').click();
    alert("アルバムを初期化しました。次の旅行の思い出を入力できます！");
  }
}
openDB().then(()=>{settings();refresh()}).catch(()=>alert("このブラウザでは写真保存機能を利用できません。"));
</script></body></html>
